onboarding = false
[theme]
name = "catppuccin"
auto_switch = false

[keys]
# Direct ctrl+h/j/k/l are handled by the husam.vim-navigator plugin below
# instead of focus_pane_*, so they can pass through into vim/nvim (and let
# vim-tmux-navigator bounce back out at split edges) instead of Herdr always
# stealing them. prefix+h/j/k/l keeps working via the built-in default.

# Navigate-mode movement (e.g. the workspace picker opened with prefix+w).
# navigate_pane_left/right default to h/l already; add vim-style up/down
# so h/j/k/l all work for moving through the workspace list.
navigate_workspace_up = "k"
navigate_workspace_down = "j"
navigate_pane_left = "h"
navigate_pane_down = "j"
navigate_pane_up = "k"
navigate_pane_right = "l"

# Cycle through agents in the agent panel (sorted by priority, see [ui]).
next_agent = "ctrl+alt+n"
previous_agent = "ctrl+alt+p"

# Toggle (hide/show) the sidebar/side panel.
toggle_sidebar = "ctrl+t"

[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "husam.vim-navigator.left"
description = "smart focus left (vim-aware)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "husam.vim-navigator.down"
description = "smart focus down (vim-aware)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "husam.vim-navigator.up"
description = "smart focus up (vim-aware)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "husam.vim-navigator.right"
description = "smart focus right (vim-aware)"

[ui]
agent_panel_sort = "priority"
# Create new tabs immediately without prompting for a name.
prompt_new_tab_name = false
status_indicators = "dots"
show_agent_labels_on_pane_borders = true
